<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POMODORO TIMER</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="timer-box">
            <div class="selection-part">
                <p>POMODORO TIMER</p>
                <p class="text">SELECT THE REQUIRED TIMER</p>
                <div class="timer-selection">
                    <button class="timer-one">25 MINS</button>
                    <button class="timer-two">45 MINS</button>
                </div>
            </div>
             <div class="working-part hidden">
                <p>25:00</p>
                <div class="buttons">
                    <button class="start">Start</button>
                    <button class="reset">Reset</button>
                    <button class="end">End</button>
                </div>
            </div>
        </div>
       
    </div>
</body>
</html>
